name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement

jobs:
  build:
    runs-on: ubuntu-22.04 # Environnement Linux stable et garanti
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Version stable et compatible avec Kivy
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk unzip zip
            
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer
        
    - name: Build APK with Buildozer
      run: |
        chmod +x *.py
        buildozer android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: Gestion-Budget-MAD-APK
        path: bin/*.apk
