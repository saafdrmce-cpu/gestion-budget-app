name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk unzip zip wget
            
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer
        
    - name: Force Install Android SDK Manager (Buildozer Fix)
      run: |
        # 1. Créer la structure de dossier EXACTE que Buildozer vérifie en dur
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Télécharger les Command Line Tools officiels d'Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
        unzip -q /tmp/cmdline.zip -d /tmp/
        
        # 3. Les déplacer vers l'emplacement moderne
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mv /tmp/cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
        
        # 4. LE LIEN MAGIQUE : Créer un raccourci pour tromper la vérification de Buildozer
        ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 5. VÉRIFICATION : Afficher le lien pour confirmer qu'il existe (vous le verrez dans les logs)
        ls -l $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 6. Accepter automatiquement toutes les licences Android
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Verify buildozer.spec requirements
      run: |
        # Cette étape vérifie que vous avez bien forcé Python 3.11.6
        echo "=== VOS REQUIREMENTS ACTUELS ==="
        cat buildozer.spec | grep requirements || echo "Fichier buildozer.spec introuvable !"
        
    - name: Build APK with Buildozer
      run: |
        chmod +x *.py
        buildozer android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gestion-Budget-MAD-APK
        path: bin/*.apk
