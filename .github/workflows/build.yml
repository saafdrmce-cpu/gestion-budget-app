name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk unzip zip wget
            
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer
        
    - name: CRITICAL FIX - Force SDK Manager Symlink
      run: |
        echo "🔧 Application du correctif critique pour Buildozer..."
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        
        # 1. Nettoyer tout état corrompu précédent
        rm -rf $SDK_DIR
        
        # 2. Créer le dossier EXACT que Buildozer vérifie en dur
        mkdir -p $SDK_DIR/tools/bin
        
        # 3. Télécharger les vrais Command Line Tools d'Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
        unzip -q /tmp/cmdline.zip -d /tmp/
        
        # 4. Les déplacer vers l'emplacement moderne
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv /tmp/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
        
        # 5. LE LIEN MAGIQUE : Créer un raccourci pour tromper Buildozer
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
        
        # 6. PREUVE : Afficher le lien dans les logs (vous devez voir cette ligne)
        echo "✅ Vérification du lien symbolique :"
        ls -l $SDK_DIR/tools/bin/sdkmanager
        
        # 7. Accepter automatiquement toutes les licences avec le VRAI sdkmanager
        export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

    - name: Verify buildozer.spec requirements
      run: |
        echo "=== VÉRIFICATION DES REQUIREMENTS ==="
        grep "requirements =" buildozer.spec || echo "Fichier buildozer.spec introuvable !"
        
    - name: Build APK with Buildozer
      run: |
        chmod +x *.py
        buildozer android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gestion-Budget-MAD-APK
        path: bin/*.apk
