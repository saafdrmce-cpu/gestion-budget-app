name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk unzip zip wget
            
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer
        
    - name: Setup Android SDK & Accept Licenses
      run: |
        # 1. Créer le dossier des licences et accepter les licences Android
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # 2. Télécharger et installer manuellement les Command Line Tools (pour éviter le bug sdkmanager manquant)
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        cd $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools/* .
        rm -rf cmdline-tools cmdline-tools.zip
        
        # 3. Installer les composants de base requis
        yes | ./bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
        
    - name: Build APK with Buildozer
      run: |
        chmod +x *.py
        # Le "yes |" est une sécurité supplémentaire pour accepter toute question résiduelle
        yes | buildozer android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gestion-Budget-MAD-APK
        path: bin/*.apk
