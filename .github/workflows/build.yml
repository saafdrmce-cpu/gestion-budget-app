
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "Cython==0.29.34" buildozer

      - name: Verify project configuration
        run: |
          echo "=== buildozer.spec ==="
          cat buildozer.spec

          echo "=== Host Python ==="
          python --version

          echo "=== Java ==="
          java -version
          javac -version

          echo "=== Buildozer ==="
          buildozer --version

          echo "=== Python syntax ==="
          python -m py_compile main.py database.py

          echo "=== Android settings ==="
          grep -E '^(requirements|p4a.branch|android.api|android.ndk_api|android.minapi|android.ndk) *=' buildozer.spec || true

      # Cache seulement les outils et SDK Android.
      # Ne pas supprimer .buildozer après la restauration du cache.
      - name: Restore Buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-
            buildozer-${{ runner.os }}-

      - name: Clean old APK and project build files
        run: |
          rm -rf bin
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
        env:
          P4A_RELEASE: "0"
          PYTHONUNBUFFERED: "1"

      - name: Save Buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Budget-MAD-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Budget-MAD-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
