name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev python3-pip \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk unzip zip wget
            
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33 buildozer
        
    - name: Setup Android SDK & Fix Buildozer Path
      run: |
        # 1. Créer le dossier obsolète que Buildozer cherche obstinément
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        
        # 2. Télécharger les "cmdline-tools" officiels d'Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
        unzip -q /tmp/cmdline.zip -d /tmp/
        
        # 3. Les placer dans la structure moderne
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mv /tmp/cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
        
        # 4. LE LIEN MAGIQUE : Créer un raccourci pour tromper Buildozer
        ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 5. Accepter automatiquement toutes les licences Android
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Build APK with Buildozer
      run: |
        chmod +x *.py
        # S'assurer que le PATH contient les outils
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/platform/android-sdk/platform-tools
        buildozer android debug
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gestion-Budget-MAD-APK
        path: bin/*.apk
